[package]
name = "orbis-scriptor"
version = "0.5.0"
description = "Local-first desktop app for fantasy worldbuilding"
license-file = "../LICENSE"
authors = ["Oscar Freeman"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which otherwise clashes on Windows (rust-lang/cargo#8519).
name = "orbis_scriptor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# tauri-specta generates src/lib/bindings.ts from our commands. It is still a
# release candidate, so specta must be pinned with `=` exactly as it requires.
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
# SQLite compiled into the binary (`bundled`) so users need nothing installed.
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Markdown import: CommonMark/GFM parser (we need events, not HTML output).
pulldown-cmark = { version = "0.13.4", default-features = false }
# YAML front matter. serde_yaml is archived and serde_yml has had unsoundness
# advisories, so we use yaml-rust2 (maintained, small) and convert its values
# to serde_json ourselves.
yaml-rust2 = { version = "0.13.0", default-features = false }
rand = "0.10.3"
rand_chacha = "0.10.0"
noise = "0.9.0"

[dev-dependencies]
serde_yaml = "0.9"
# Temporary folders for tests; deleted automatically when dropped.
tempfile = "3"

[lints.clippy]
# CLAUDE.md rule 3: no unwrap()/expect() outside tests and startup code.
unwrap_used = "warn"
expect_used = "warn"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The terrain generator encodes multi-megapixel PNGs and samples a lot of
# noise. Unoptimised (debug) builds of these few dependencies are ~30x
# slower, so optimise just them in dev builds; our own code stays debuggable.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.noise]
opt-level = 3
